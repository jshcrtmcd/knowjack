<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" font-family="system-ui, sans-serif">
  <title>Arterial pressure waveform with an intra-aortic balloon pump on 1:2 — one unassisted beat, then one assisted beat</title>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#f3b7b7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="460" height="220" fill="#fff3f3"/>
  <rect width="460" height="220" fill="url(#grid)"/>
  <!-- unassisted beat -->
  <g id="unassisted-systole" fill="none" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round">
    <path d="M20 150 C 40 150, 50 70, 80 60 C 100 56, 108 90, 120 110"/>
  </g>
  <g id="dicrotic-notch" fill="none" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round">
    <path d="M120 110 l 6 8 l 6 -4"/>
  </g>
  <g id="unassisted-diastole" fill="none" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round">
    <path d="M132 114 C 150 118, 170 136, 196 150"/>
  </g>
  <!-- assisted beat: balloon inflates at the dicrotic notch -->
  <g id="assisted-systole" fill="none" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round">
    <path d="M196 150 C 216 150, 224 82, 250 74 C 268 70, 276 98, 288 116"/>
  </g>
  <g id="inflation-point" fill="none" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round">
    <path d="M288 116 l 6 8 l 6 -6"/>
  </g>
  <g id="augmentation" fill="none" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round">
    <path d="M300 118 C 310 70, 330 34, 350 36 C 370 38, 380 90, 392 134"/>
  </g>
  <g id="assisted-eod" fill="none" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round">
    <path d="M392 134 C 400 150, 406 168, 416 170 C 424 170, 430 160, 440 150"/>
  </g>
  <g font-size="11" fill="#1a1030" opacity=".6">
    <text x="30" y="200">unassisted beat</text>
    <text x="260" y="200">assisted beat (balloon on)</text>
    <text x="8" y="40">↑ pressure</text>
  </g>
</svg>
